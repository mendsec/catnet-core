name: Cleanup Non-DevSecOps Branches

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at 00:00
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run safety unit tests
        run: |
          chmod +x scripts/cleanup-branches.sh scripts/cleanup-branches_test.sh
          ./scripts/cleanup-branches_test.sh

      - name: Cleanup invalid branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/cleanup-branches.sh
